{% extends "base.html" %}
{% block title %}Add Project{% endblock %}
{% block content %}
<section class="section project-form-section">
<div class="container admin-form-page">
    <p class="eyebrow">Portfolio management</p>
    <h2>Add new project</h2>

    <form method="POST" class="admin-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Project Title</label>
            <input type="text" name="title" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="5" required></textarea>
        </div>

        <div class="form-group">
            <label>Project Link</label>
            <input type="text" name="link" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success">Add project <span aria-hidden="true">↗</span></button>
        <a href="/admin" class="btn btn-default">Cancel</a>
    </form>
</div>
 </section>
{% endblock %}
