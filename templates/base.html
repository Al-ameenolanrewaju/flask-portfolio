<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio{% endblock %}</title>

    <meta name="theme-color" content="#101512">
    <meta name="description" content="Al-ameen Olanrewaju — Developer, Builder, and AI Entrepreneur.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 3.4.1 -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="site-shell">

<!-- NAVBAR -->
<nav class="navbar navbar-default custom-navbar">
    <div class="container">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="/" aria-label="Al-ameen Olanrewaju home">
                <span class="brand-mark">AO</span>
                <span>AL-AMEEN<span class="brand-dot">.</span></span>
            </a>
        </div>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="nav navbar-nav navbar-right">
                <li class="nav-item active"><a href="#home">Home</a></li>
                <li class="nav-item"><a href="#services">Services</a></li>
                <li class="nav-item"><a href="#about">About</a></li>
                <li class="nav-item"><a href="#projects">Portfolio</a></li>
                <li class="nav-item"><a href="#contact">Contact</a></li>
                <li class="nav-item nav-cta"><a href="#contact">Hire me <span aria-hidden="true">↗</span></a></li>
            </ul>
        </div>
    </div>
</nav>

<main id="home">{% block content %}{% endblock %}</main>

<!-- FOOTER -->
<footer class="footer">
    <div class="container footer-inner">
        <div>
            <p class="footer-kicker">Al-ameen Olanrewaju</p>
            <p class="footer-note">Developer · Builder · AI Entrepreneur</p>
        </div>
        <div class="footer-meta">
            <div class="footer-social" aria-label="Social links">
                <a href="https://x.com/Alameenwaju" target="_blank" rel="noopener noreferrer" aria-label="X / Twitter"><i class="fab fa-twitter"></i></a>
                <a href="https://www.linkedin.com/in/al-ameen-olanrewaju-760618404" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="https://github.com/Al-ameenolanrewaju" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://www.facebook.com/share/1EEgncNbMh/" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
                <a href="https://wa.me/+2349038014978" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            </div>
            <p class="footer-copy">&copy; <span id="currentYear"></span> · Lagos, Nigeria</p>
        </div>
    </div>
</footer>

</div>

<!-- JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<script src="{{ url_for('static',filename='js/main.js')}}"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const yearSpan = document.getElementById('currentYear');
        yearSpan.textContent = new Date().getFullYear();
    });
</script>
</body>
</html>
